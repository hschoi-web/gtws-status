name: refresh-status
# GTWS 예약현황 매일 갱신 (라이더스 어드민 리포트 → status.json / status-en.json 커밋)
# 2026-08-06 원천 교체: 노션 DB → https://admin.rideus.net/shuttlebus-report/gtws (인증 불필요, NOTION_TOKEN 사용 안 함)
on:
  schedule:
    # 20분마다 (KST 07:00~23:59). 어드민 리포트는 실시간 예약 반영이라 1일 3회로는
    # 운영자가 어드민 화면과 대조할 때 몇 시간씩 어긋나 보임 (olivia 확인 2026-08-07).
    - cron: '*/20 22-23,0-14 * * *'   # UTC 22~23시 = KST 07~08시, UTC 0~14시 = KST 09~23시
  workflow_dispatch: {}       # 수동 실행 버튼

permissions:
  contents: write             # status.json 커밋용

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build status from admin report
        run: node build_status.mjs
      - name: Commit if changed
        run: |
          git config user.name "gtws-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status.json status-en.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: refresh status ($(date -u +%FT%TZ))"
            git push
          fi
