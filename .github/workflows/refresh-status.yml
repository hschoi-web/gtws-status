name: refresh-status
# GTWS 예약현황 매일 갱신 (라이더스 어드민 리포트 → status.json / status-en.json 커밋)
# 2026-08-06 원천 교체: 노션 DB → https://admin.rideus.net/shuttlebus-report/gtws (인증 불필요, NOTION_TOKEN 사용 안 함)
on:
  schedule:
    # 1일 2회 (olivia 확정 2026-08-07). 화면은 어드민을 직접 읽어 실시간으로 그리므로
    # 여기서 굽는 status.json 은 어드민 장애 시 쓰는 폴백 스냅샷 용도다.
    - cron: '0 0,9 * * *'      # 00:00 / 09:00 UTC = 09:00 / 18:00 KST
  workflow_dispatch: {}       # 수동 실행 버튼

permissions:
  contents: write             # status.json 커밋용

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build status from admin report
        run: node build_status.mjs
      - name: Commit if changed
        run: |
          git config user.name "gtws-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status.json status-en.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: refresh status ($(date -u +%FT%TZ))"
            git push
          fi
